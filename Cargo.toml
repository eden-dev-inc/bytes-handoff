[package]
name = "bytes-handoff"
version = "1.3.0"
edition = "2024"
rust-version = "1.85"
description = "Incremental async byte ingestion and bounded owned write handoff."
license = "MIT"
repository = "https://github.com/eden-dev-inc/bytes-handoff"
readme = "README.md"
keywords = ["async", "bytes", "tokio", "buffer", "handoff"]
categories = ["asynchronous", "network-programming"]
exclude = [
    ".claude/**",
    "bench/results/**",
    "target/**",
]

[workspace]
resolver = "3"

[dependencies]
bytes = "1.11"
fast-telemetry = { version = "0.6", features = ["runtime"], optional = true }
fast-telemetry-export = { version = "0.6", optional = true, default-features = false }
hdrhistogram = { version = "7", optional = true }
libc = { version = "0.2", optional = true }
monoio = { version = "0.2.4", default-features = false, features = ["bytes", "legacy"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "sync"] }

[features]
bench-tools = [
    "hdrhistogram",
    "dep:libc",
    "monoio",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/time",
]
monoio = ["dep:monoio"]
telemetry = ["dep:fast-telemetry"]
telemetry-otlp = ["telemetry", "fast-telemetry/otlp"]
telemetry-clickhouse = ["telemetry", "fast-telemetry/clickhouse"]
telemetry-export-dogstatsd = ["telemetry", "dep:fast-telemetry-export", "fast-telemetry-export/dogstatsd"]
telemetry-export-otlp = ["telemetry-otlp", "dep:fast-telemetry-export", "fast-telemetry-export/otlp"]
telemetry-export-clickhouse = [
    "telemetry-clickhouse",
    "dep:fast-telemetry-export",
    "fast-telemetry-export/clickhouse",
]
telemetry-export = ["telemetry-export-dogstatsd", "telemetry-export-otlp"]
telemetry-monoio = ["monoio", "telemetry-export", "fast-telemetry-export/monoio"]

[dev-dependencies]
criterion = "0.5"
memchr = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util"] }

[lints.clippy]
unwrap_used = "deny"

[[bench]]
name = "read_handoff"
harness = false

[[bench]]
name = "write_handoff"
harness = false

[[bin]]
name = "bench_stream_harness"
path = "src/bin/bench_stream_harness.rs"
required-features = ["bench-tools"]

[[bin]]
name = "tune_coalescing"
path = "src/bin/tune_coalescing.rs"

[[example]]
name = "monoio_line_protocol"
path = "examples/monoio_line_protocol.rs"
required-features = ["monoio"]

[[example]]
name = "read_telemetry"
path = "examples/read_telemetry.rs"
required-features = ["telemetry"]
